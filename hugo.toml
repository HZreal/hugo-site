baseURL = "https://my.elastic-code.com/"
title = "Elastic Code"
theme = "blowfish"

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 30

[pagination]
pagerSize = 12

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[sitemap]
changefreq = "daily"
filename = "sitemap.xml"
priority = 0.5

[related]
threshold = 0
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "categories"
weight = 100

[[related.indices]]
name = "series"
weight = 50

[languages]
[languages.zh]
locale = "zh-cn"
label = "简体中文"
contentDir = "content/zh"
weight = 1
title = "Elastic Code"

[languages.zh.params]
displayName = "简体中文"
isoCode = "zh-cn"
dateFormat = "2006-01-02"
description = "Elastic Code 的个人技术空间，记录服务端工程、架构设计、DevOps 与 AI 辅助研发实践。"

[languages.zh.params.author]
name = "Elastic Code"
image = "image/logo.webp"
headline = "乐享求知的全栈攻城狮"
bio = "主攻服务端技术栈、系统架构设计、DevOps，持续沉淀技术文档和项目实践。"
links = [
  { github = "https://github.com/HZreal" }
]

[[languages.zh.menus.main]]
name = "首页"
pageRef = "/"
weight = 1

[[languages.zh.menus.main]]
