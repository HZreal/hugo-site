[params]
colorScheme = "blowfish"
defaultAppearance = "dark"
autoSwitchAppearance = false
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true
disableTextInHeader = false
fingerprintAlgorithm = "sha512"

[params.header]
layout = "fixed-fill-blur"

[params.footer]
showMenu = true
showCopyright = true
showThemeAttribution = false
showAppearanceSwitcher = true
showScrollToTop = true

[params.homepage]
layout = "background"
showRecent = false
layoutBackgroundBlur = true

[params.article]
showDate = true
showAuthor = false
showHero = true
heroStyle = "background"
showBreadcrumbs = true
showDraftLabel = true
showHeadingAnchors = true
showPagination = true
showReadingTime = true
showTableOfContents = true
showTaxonomies = true
showCategories = true
showTags = true
showWordCount = true
showZenMode = true

[params.list]
showHero = true
heroStyle = "background"
showBreadcrumbs = true
showSummary = true
showTableOfContents = false
showCards = true
groupByYear = false
cardView = true
cardViewScreenWidth = false

[params.taxonomy]
showTermCount = true
showHero = true
heroStyle = "background"
cardView = true

[params.term]
showHero = true
heroStyle = "background"
showTableOfContents = true
groupByYear = false
cardView = true

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
